name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    name: Bridge (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 20
          - os: macos-latest
            node: 26
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check the bridge
        run: |
          node --check bridge/pz-bridge.mjs
          node --check bridge/llm.mjs
          node --check bridge/config.mjs
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('bridge/package.json','utf8'))"
      - name: Test isolated bridge configuration and runtime
        working-directory: bridge
        run: node --test

  mod:
    name: Mod (Lua) sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luac
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Lua parse check (Kahlua is 5.1-compatible)
        run: |
          for f in $(find mods -name '*.lua'); do
            echo "checking $f"
            luac5.1 -p "$f"
          done
      - name: mod.info present at root and version folder
        run: |
          test -f mods/ClaudeSurvivor/mod.info
          test -f mods/ClaudeSurvivor/42/mod.info
